
name: Build RMS CREDITS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RMS_CREDITS_Android_Studio_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q RMS_CREDITS_Android_Studio_Project.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/RMS_CREDITS_Android_Project" >> "$GITHUB_ENV"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RMS-CREDITS-APK
          path: extracted/RMS_CREDITS_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

